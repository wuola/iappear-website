<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>i.appear &ndash; In Zahlen</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap');

  :root {
    --c-bg: #000000;
    --c-surface: #111111;
    --c-border: #2a2a2a;
    --c-text: #ffffff;
    --c-muted: #a0a0a0;
    --c-history: #D3A54A;
    --f-sans: 'Roboto', system-ui, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--c-bg);
    color: var(--c-text);
    font-family: var(--f-sans);
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
    padding: 2rem 1rem;
  }

  .graphic {
    width: 100%;
    max-width: 720px;
  }

  .graphic-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 1.5rem;
  }

  .graphic-logo-mark {
    width: 40px;
    height: auto;
    opacity: 0.85;
    flex-shrink: 0;
  }

  .header-label {
    font-size: 0.75rem;
    font-weight: 400;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--c-muted);
    margin-bottom: 0.3rem;
  }

  .header-title {
    font-size: 1.1rem;
    font-weight: 300;
    line-height: 1.3;
  }

  .header-title em {
    font-style: normal;
    color: var(--c-history);
  }

  .divider {
    height: 1px;
    background: var(--c-border);
    margin: 1.5rem 0;
  }

  /* Number Grid */
  .numbers {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 0;
    position: relative;
  }

  .number-cell {
    padding: 1.8rem 1rem;
    text-align: center;
    position: relative;
    opacity: 0;
    transform: translateY(12px);
    animation: fadeUp 0.6s cubic-bezier(.2,.7,.2,1) forwards;
  }

  .number-cell:nth-child(1) { animation-delay: 0.1s; }
  .number-cell:nth-child(2) { animation-delay: 0.25s; }
  .number-cell:nth-child(3) { animation-delay: 0.4s; }

  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }

  /* Vertical dividers */
  .number-cell:not(:nth-child(3n))::after {
    content: '';
    position: absolute;
    right: 0;
    top: 20%;
    height: 60%;
    width: 1px;
    background: var(--c-border);
  }

  .big-number {
    font-size: 3.5rem;
    font-weight: 300;
    line-height: 1;
    color: var(--c-text);
    font-variant-numeric: tabular-nums;
    margin-bottom: 0.5rem;
  }

  .big-number .accent {
    color: var(--c-history);
  }

  .number-label {
    font-size: 0.7rem;
    font-weight: 400;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--c-muted);
    line-height: 1.4;
  }

  /* Bottom row - 2 wide cells */
  .numbers-bottom {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    border-top: 1px solid var(--c-border);
    position: relative;
  }

  .numbers-bottom .number-cell {
    padding: 1.8rem 1rem;
  }

  .numbers-bottom .number-cell:nth-child(1) { animation-delay: 0.55s; }
  .numbers-bottom .number-cell:nth-child(2) { animation-delay: 0.7s; }

  .numbers-bottom .number-cell:first-child::after {
    content: '';
    position: absolute;
    right: 0;
    top: 20%;
    height: 60%;
    width: 1px;
    background: var(--c-border);
  }

  .big-number-zero {
    font-size: 3.5rem;
    font-weight: 300;
    line-height: 1;
    color: var(--c-muted);
    opacity: 0.4;
    font-variant-numeric: tabular-nums;
    margin-bottom: 0.5rem;
  }

  .zero-label {
    font-size: 0.7rem;
    font-weight: 400;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--c-history);
    line-height: 1.4;
  }

  /* Footer */
  .graphic-footer {
    margin-top: 2rem;
    padding-top: 1rem;
    border-top: 1px solid var(--c-border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .graphic-logo {
    font-size: 0.85rem;
    font-weight: 300;
    letter-spacing: 0.04em;
  }

  .graphic-logo .i-dot { font-weight: 500; }

  .graphic-date {
    font-size: 0.7rem;
    color: var(--c-muted);
    letter-spacing: 0.04em;
  }

  /* Mobile */
  @media (max-width: 480px) {
    .big-number, .big-number-zero {
      font-size: 2.5rem;
    }
    .number-cell {
      padding: 1.2rem 0.5rem;
    }
    .numbers-bottom .number-cell {
      padding: 1.2rem 0.5rem;
    }
  }
</style>
</head>
<body>
  <div class="graphic">
    <div class="graphic-top">
      <div>
        <div class="header-label">Digitale Stadtrundg&#228;nge</div>
        <div class="header-title"><em>i.appear</em> in Zahlen</div>
      </div>
      <svg class="graphic-logo-mark" viewBox="0 0 123.56 233.11" xmlns="http://www.w3.org/2000/svg">
        <path d="M37.54,233.11v-14.79c4.75-.91,10.4-1.83,15.88-2.19v-55.86c-4.38-.73-10.59-1.46-15.88-1.83v-14.6c11.5-1.46,25.56-2.01,39.06-1.64v73.93c5.11.36,10.4,1.28,14.79,2.19v14.79h-53.85Z" fill="#fff" stroke="#fff" stroke-miterlimit="10"/>
        <path d="M61.69,75.15c-8,0-14.37-6.37-14.37-14.19s6.37-14.01,14.37-14.01,14.55,6.18,14.55,14.01-6.55,14.19-14.55,14.19Z" fill="#fff" stroke="#fff" stroke-miterlimit="10"/>
        <circle cx="61.78" cy="61.78" r="50.28" fill="none" stroke="#fff" stroke-miterlimit="10" stroke-width="23"/>
      </svg>
    </div>

    <div class="divider"></div>

    <div class="numbers">
      <div class="number-cell">
        <div class="big-number">10</div>
        <div class="number-label">Live-Touren</div>
      </div>
      <div class="number-cell">
        <div class="big-number">80</div>
        <div class="number-label">Stationen</div>
      </div>
      <div class="number-cell">
        <div class="big-number">4</div>
        <div class="number-label">Regionen</div>
      </div>
    </div>

    <div class="numbers-bottom">
      <div class="number-cell">
        <div class="big-number-zero">0</div>
        <div class="zero-label">Downloads n&#246;tig</div>
      </div>
      <div class="number-cell">
        <div class="big-number-zero">0</div>
        <div class="zero-label">Daten gesammelt</div>
      </div>
    </div>

    <div class="graphic-footer">
      <div class="graphic-logo"><span class="i-dot">i.</span>appear</div>
      <div class="graphic-date">Stand April 2026</div>
    </div>
  </div>
</body>
</html>
