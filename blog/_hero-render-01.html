<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<title>Hero-Render Artikel 01 (intern, nicht indexiert)</title>
<meta name="robots" content="noindex,nofollow" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #000; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 60px 40px;
    font-family: system-ui, sans-serif;
  }
  .stage {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 60px;
  }
  .phone {
    width: 466px;
    height: 948px;
    background: #000;
    border-radius: 44px;
    padding: 10px;
    border: 2px solid #2a2a2a;
    box-shadow: 0 30px 70px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.04);
    position: relative;
    flex-shrink: 0;
  }
  .phone::before {
    content: '';
    position: absolute;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    width: 110px;
    height: 24px;
    background: #000;
    border-radius: 12px;
    z-index: 2;
  }
  .phone__screen {
    width: 100%;
    height: 100%;
    border-radius: 36px;
    overflow: hidden;
    background: #000;
  }
  .phone__screen img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="phone">
      <div class="phone__screen">
        <img src="../assets/videos/hero/navigation.jpg" alt="" />
      </div>
    </div>
    <div class="phone">
      <div class="phone__screen">
        <img src="../assets/videos/hero/histappear.jpg" alt="" />
      </div>
    </div>
  </div>
</body>
</html>
